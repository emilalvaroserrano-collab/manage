name: Materialize MTS portal source
on:
  push:
    branches: [main]
    paths:
      - source-archive.br64
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Unpack reviewed source bundle
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const zlib = require("node:zlib");
            const base64 = fs.readFileSync("source-archive.br64", "utf8").replace(/\s+/g, "");
            fs.writeFileSync("/tmp/mts-source.tar", zlib.brotliDecompressSync(Buffer.from(base64, "base64")));
          '
          tar -xf /tmp/mts-source.tar
          rm -f source-archive.br64 .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: materialize MTS Zendesk-only Next.js portal"
            git push origin HEAD:main
          fi
